<!DOCTYPE html>
<html>
<head>
    <title>XML Data</title>
</head>

<body>

    <h2>Items Table</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Description</th>
            </tr>
        </thead>

        <tbody id="data">
        </tbody>
    </table>

    <script>

        let xhttp = new XMLHttpRequest();

        xhttp.onreadystatechange = function() {

            if (this.readyState == 4 && this.status == 200) {

                let xmlDoc = this.responseXML;

                let items = xmlDoc.getElementsByTagName("item");

                let table = "";

                for (let i = 0; i < items.length; i++) {

                    let name = items[i].getElementsByTagName("name")[0].textContent;

                    let price = items[i].getElementsByTagName("price")[0].textContent;

                    let description = items[i].getElementsByTagName("description")[0].textContent;

                    table += "<tr>";

                    table += "<td>" + name + "</td>";

                    table += "<td>" + price + "</td>";

                    table += "<td>" + description + "</td>";

                    table += "</tr>";
                }

                document.getElementById("data").innerHTML = table;

            }
        };

        xhttp.open("GET", "index.xml", true);

        xhttp.send();

    </script>

</body>
</html>
